apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      containers:
        - name: user-service
          image: maknos/user-service:latest

          ports:
            - containerPort: 3001

          env:
            - name: DB_HOST
              value: postgres

            - name: DB_PORT
              value: "5432"

            - name: DB_USERNAME
              value: root

            - name: DB_PASSWORD
              value: root

            - name: DB_NAME
              value: velora_postgres