name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ========================
  # 1. BUILD & TEST
  # ========================
  build-and-test:
    name: Build & Test Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install & test auth-service
        working-directory: backend/velora-platform/auth-service
        run: |
          npm install
          npm run build --if-present

      - name: Install & test user-service
        working-directory: backend/velora-platform/user-service
        run: |
          npm install
          npm run build --if-present

      - name: Install & test admin-service
        working-directory: backend/velora-platform/admin-service
        run: |
          npm install
          npm run build --if-present

  # ========================
  # 2. SECURITY SCAN (SAST)
  # ========================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '0'

      - name: Run npm audit on auth-service
        working-directory: backend/velora-platform/auth-service
        run: npm install && npm audit --audit-level=high || true

  # ========================
  # 3. DOCKER BUILD
  # ========================
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all services
        working-directory: backend/velora-platform
        run: docker compose build

  # ========================
  # 4. MONITORING CHECK
  # ========================
  monitoring-check:
    name: Verify Monitoring Config
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Prometheus config
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/backend/velora-platform/monitoring/prometheus:/etc/prometheus \
            prom/prometheus:latest \
            promtool check config /etc/prometheus/prometheus.yml

      - name: Validate alert rules
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/backend/velora-platform/monitoring/prometheus:/etc/prometheus \
            prom/prometheus:latest \
            promtool check rules /etc/prometheus/alerts.yml
