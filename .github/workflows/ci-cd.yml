name: Velora CI/CD Pipeline

on:
  push:
    branches:
      - pipeline
  pull_request:
    branches:
      - pipeline

jobs:

  backend-build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - user-service
          - admin-service
          - customer-service
          - dashboard-service

    defaults:
      run:
        working-directory: backend/velora-platform/${{ matrix.service }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        continue-on-error: true

      - name: Build service
        run: npm run build
        continue-on-error: true

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Security audit
        run: npm audit --audit-level=high || true
        continue-on-error: true

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps
        continue-on-error: true

      - name: Build frontend
        run: npm run build
        continue-on-error: true

      - name: Security audit frontend
        run: npm audit --audit-level=high || true
        continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    needs:
      - backend-build
      - frontend-build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push auth-service
        run: |
          docker build -t maknos/auth-service:latest ./backend/velora-platform/auth-service
          docker push maknos/auth-service:latest

      - name: Build and push user-service
        run: |
          docker build -t maknos/user-service:latest ./backend/velora-platform/user-service
          docker push maknos/user-service:latest

      - name: Build and push admin-service
        run: |
          docker build -t maknos/admin-service:latest ./backend/velora-platform/admin-service
          docker push maknos/admin-service:latest

      - name: Build and push customer-service
        run: |
          docker build -t maknos/customer-service:latest ./backend/velora-platform/customer-service
          docker push maknos/customer-service:latest

      - name: Build and push dashboard-service
        run: |
          docker build -t maknos/dashboard-service:latest ./backend/velora-platform/dashboard-service
          docker push maknos/dashboard-service:latest

      - name: Build and push frontend
        run: |
          docker build -t maknos/frontend:latest ./frontend
          docker push maknos/frontend:latest

  security-scan:
    runs-on: ubuntu-latest
    needs:
      - docker-build

    strategy:
      matrix:
        image:
          - maknos/auth-service:latest
          - maknos/user-service:latest
          - maknos/admin-service:latest
          - maknos/customer-service:latest
          - maknos/dashboard-service:latest
          - maknos/frontend:latest

    steps:
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH