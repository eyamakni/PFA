name: Velora CI/CD Pipeline

on:
  push:
    branches:
      - pipeline
  pull_request:
    branches:
      - pipeline

jobs:

  backend-build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - user-service
          - admin-service
          - customer-service
          - dashboard-service

    defaults:
      run:
        working-directory: backend/velora-platform/${{ matrix.service }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        continue-on-error: true

      - name: Build service
        run: npm run build
        continue-on-error: true

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Security audit
        run: npm audit --audit-level=high || true
        continue-on-error: true

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps
        continue-on-error: true

      - name: Build frontend
        run: npm run build
        continue-on-error: true

      - name: Security audit frontend
        run: npm audit --audit-level=high || true
        continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    needs:
      - backend-build
      - frontend-build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build auth-service image
        run: docker build -t auth-service ./backend/velora-platform/auth-service

      - name: Build user-service image
        run: docker build -t user-service ./backend/velora-platform/user-service

      - name: Build admin-service image
        run: docker build -t admin-service ./backend/velora-platform/admin-service

      - name: Build customer-service image
        run: docker build -t customer-service ./backend/velora-platform/customer-service

      - name: Build dashboard-service image
        run: docker build -t dashboard-service ./backend/velora-platform/dashboard-service

      - name: Build frontend image
        run: docker build -t frontend ./frontend